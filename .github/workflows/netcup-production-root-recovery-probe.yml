name: Netcup Production Root Recovery Probe

on:
  push:
    branches:
      - fix/dashboard-device-auth-prod-v1
    paths:
      - '.github/workflows/netcup-production-root-recovery-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Probe protected production transport without mutation
        shell: bash
        env:
          KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
          HOST: ${{ secrets.NETCUP_HOST }}
          USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ -n "$KEY" ]] || { echo 'PROD_ENV_KEY=UNAVAILABLE'; exit 41; }
          [[ -n "$HOSTS" && -n "$HOST" && -n "$USER" ]] || { echo 'PROD_ENV_TRANSPORT_METADATA=UNAVAILABLE'; exit 42; }
          echo 'PROD_ENV_TRANSPORT=AVAILABLE'
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/netcup_key"
          chmod 600 "$HOME/.ssh/netcup_key"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          out="$(ssh -i "$HOME/.ssh/netcup_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 root@"$HOST" 'id -u' 2>&1 || true)"
          if [[ "$out" == '0' ]]; then
            echo 'PROD_ENV_DIRECT_ROOT=AVAILABLE'
          else
            echo 'PROD_ENV_DIRECT_ROOT=UNAVAILABLE'
          fi
          user_out="$(ssh -i "$HOME/.ssh/netcup_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$USER@$HOST" 'id -u' 2>&1 || true)"
          if [[ "$user_out" =~ ^[0-9]+$ ]]; then
            echo 'PROD_ENV_DEPLOY_USER_DIRECT_SHELL=AVAILABLE'
          else
            echo 'PROD_ENV_DEPLOY_USER_DIRECT_SHELL=RESTRICTED_OR_UNAVAILABLE'
          fi
