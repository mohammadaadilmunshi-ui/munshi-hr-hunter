name: Netcup Emergency API Probe

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-emergency-api-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Probe only known administrative API ports
        shell: bash
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          docker_http="$(curl -sS --connect-timeout 3 --max-time 5 -o /tmp/docker2375.out -w '%{http_code}' "http://$NETCUP_HOST:2375/_ping" || true)"
          caddy_http="$(curl -sS --connect-timeout 3 --max-time 5 -o /tmp/caddy2019.out -w '%{http_code}' "http://$NETCUP_HOST:2019/config/" || true)"
          docker_tls="$(curl -ksS --connect-timeout 3 --max-time 5 -o /tmp/docker2376.out -w '%{http_code}' "https://$NETCUP_HOST:2376/_ping" || true)"
          echo "DOCKER_2375_HTTP=${docker_http:-000}"
          echo "DOCKER_2376_HTTPS=${docker_tls:-000}"
          echo "CADDY_2019_HTTP=${caddy_http:-000}"
          if [[ "$docker_http" == "200" ]] && grep -qx 'OK' /tmp/docker2375.out; then
            echo 'DOCKER_REMOTE_API=AVAILABLE'
          else
            echo 'DOCKER_REMOTE_API=UNAVAILABLE'
          fi
          if [[ "$caddy_http" =~ ^2 ]]; then
            echo 'CADDY_ADMIN_API=AVAILABLE'
          else
            echo 'CADDY_ADMIN_API=UNAVAILABLE'
          fi
