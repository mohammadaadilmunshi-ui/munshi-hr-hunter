name: Native Resume Studio

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-resume-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile hardened Sections 1-9 plus Stage B JD Intelligence and product shell
        run: |
          python -m py_compile \
            app/native_resume_studio.py \
            app/native_resume_service.py \
            app/native_resume_service_v2.py \
            app/native_resume_service_v3.py \
            app/native_resume_service_v4.py \
            app/phase4_job_binding.py \
            app/answer_brain.py \
            app/answer_brain_v2.py \
            app/phase45_truth_binding.py \
            app/phase67_common.py \
            app/jd_intelligence_v1.py \
            app/opportunity_intelligence_v2.py \
            app/opportunity_intelligence_v3.py \
            app/relationship_intelligence.py \
            app/relationship_intelligence_v2.py \
            app/relationship_intelligence_v3.py \
            app/phase47_integrity.py \
            app/phase8_application_truth.py \
            app/application_preflight_package_v1.py \
            app/apply_handoff.py \
            app/resume_profile_details_v31.py \
            app/resume_studio_page.py \
            app/resume_studio_page_v2.py \
            app/resume_studio_page_v3.py \
            app/resume_engine_selector.py \
            app/profile_brand_resolver.py \
            app/profile_truth_overrides_v1.py \
            app/profile_snapshot_projection.py \
            app/profile_workspace_v1.py \
            app/profile_workspace_v2.py \
            app/profile_workspace_v3.py \
            app/application_workspace_page.py \
            app/staging_feature_policy.py \
            app/cross_repo_contract.py \
            app/product_shell.py \
            docker/hunter-supervisor.py \
            scripts/phase17_staging_migrate.py \
            migrations/027_native_resume_studio.py \
            migrations/028_native_resume_studio_v2.py \
            migrations/029_native_resume_studio_v3.py \
            migrations/030_profile_workspace_v1.py \
            migrations/031_phase45_truth_bindings.py \
            migrations/032_phase67_intelligence_snapshots.py \
            migrations/033_phase47_integrity_bindings.py \
            migrations/034_phase9_application_preflight_package.py \
            migrations/035_stage_b_jd_intelligence_v1.py \
            tests/test_native_resume_studio.py \
            tests/test_native_resume_service.py \
            tests/test_native_resume_service_v2.py \
            tests/test_native_resume_service_v3.py \
            tests/test_answer_brain.py \
            tests/test_phase45_truth_binding.py \
            tests/test_phase67_intelligence.py \
            tests/test_phase47_hardening.py \
            tests/test_phase8_application_truth.py \
            tests/test_phase9_application_preflight.py \
            tests/test_stage_b_jd_intelligence.py \
            tests/test_phase17_staging_visibility.py \
            tests/test_resume_profile_details_v31.py \
            tests/test_resume_engine_selector.py \
            tests/test_profile_brand_resolver.py \
            tests/test_profile_workspace_v1.py \
            tests/test_profile_workspace_v2.py \
            tests/test_profile_truth_editor_v1.py \
            tests/test_profile_truth_revision.py \
            tests/test_profile_snapshot_projection.py \
            tests/test_cross_repo_contract.py

      - name: Run hardened Sections 1-9 plus Stage B integrated regression tests
        run: |
          python -m pytest -q \
            tests/test_native_resume_studio.py \
            tests/test_native_resume_service.py \
            tests/test_native_resume_service_v2.py \
            tests/test_native_resume_service_v3.py \
            tests/test_answer_brain.py \
            tests/test_phase45_truth_binding.py \
            tests/test_phase67_intelligence.py \
            tests/test_phase47_hardening.py \
            tests/test_phase8_application_truth.py \
            tests/test_phase9_application_preflight.py \
            tests/test_stage_b_jd_intelligence.py \
            tests/test_phase17_staging_visibility.py \
            tests/test_resume_profile_details_v31.py \
            tests/test_resume_engine_selector.py \
            tests/test_profile_brand_resolver.py \
            tests/test_profile_workspace_v1.py \
            tests/test_profile_workspace_v2.py \
            tests/test_profile_truth_editor_v1.py \
            tests/test_profile_truth_revision.py \
            tests/test_profile_snapshot_projection.py \
            tests/test_cross_repo_contract.py \
            tests/test_secure_vault.py \
            tests/test_candidate_artifacts.py \
            tests/test_tenant_foundation.py \
            tests/test_product_schema.py \
            tests/test_product_ui_v22.py

      - name: Verify no native submission authority
        run: |
          python - <<'PY'
          from app.native_resume_service import native_resume_authority_enabled
          from app.native_resume_service_v2 import native_resume_authority_enabled as v2_authority
          from app.native_resume_service_v3 import native_resume_authority_enabled as v3_authority
          from app.native_resume_service_v4 import native_resume_authority_enabled as v4_authority
          from app.native_resume_shadow import native_resume_authority_enabled as shadow_authority
          from app.phase8_application_truth import APPLICATION_TRUTH_AUTHORITY
          from app.application_preflight_package_v1 import PREFLIGHT_STATUSES
          from app.jd_intelligence_v1 import SUBMISSION_AUTHORITY as jd_submission_authority
          assert native_resume_authority_enabled() is False
          assert v2_authority() is False
          assert v3_authority() is False
          assert v4_authority() is False
          assert shadow_authority() is False
          assert APPLICATION_TRUTH_AUTHORITY == "munshi-hr-hunter"
          assert "SUBMITTED" not in PREFLIGHT_STATUSES
          assert jd_submission_authority is False
          print("Sections 1-9 plus Stage B preparation authority remains non-submitting")
          PY

      - name: Guard repository state
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3|wal|shm|pem|p12|pfx|key))$'
          git diff --check
