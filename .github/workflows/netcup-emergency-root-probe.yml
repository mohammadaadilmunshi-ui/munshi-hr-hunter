name: Netcup Emergency Root Probe

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-emergency-root-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Configure existing Netcup SSH key
        shell: bash
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/netcup_deploy"
          chmod 600 "$HOME/.ssh/netcup_deploy"
          printf '%s\n' "$NETCUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probe direct root access without mutation
        shell: bash
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          out="$(ssh -i "$HOME/.ssh/netcup_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 root@"$NETCUP_HOST" 'id -u' 2>&1 || true)"
          if [[ "$out" == "0" ]]; then
            echo 'NETCUP_DIRECT_ROOT_SSH=AVAILABLE'
          else
            echo 'NETCUP_DIRECT_ROOT_SSH=UNAVAILABLE'
            exit 42
          fi
