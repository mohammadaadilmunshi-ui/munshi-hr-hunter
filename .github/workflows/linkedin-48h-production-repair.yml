name: LinkedIn 48h Production URL Repair

on:
  workflow_dispatch:
    inputs:
      expected_hunter_sha:
        description: "Exact Hunter SHA already deployed to production"
        required: true
        type: string
      mode:
        description: "Dry-run first; apply performs the guarded 48h repair"
        required: true
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: munshi-linkedin-48h-production-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Validate request
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_hunter_sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MODE" == "dry-run" || "$MODE" == "apply" ]]

      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_hunter_sha }}

      - name: Validate repair tooling
        run: |
          python -m py_compile app/linkedin_recent_backfill.py scripts/linkedin_recent_backfill.py
          bash -n deploy/netcup/run_linkedin_48h_backfill.sh
          grep -Fq 'AUTHORIZED_LINKEDIN_48H_BACKFILL' scripts/linkedin_recent_backfill.py
          grep -Fq 'first_seen_at' app/linkedin_recent_backfill.py

      - name: Configure restricted SSH
        shell: bash
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/netcup_deploy"
          chmod 600 "$HOME/.ssh/netcup_deploy"
          printf '%s\n' "$NETCUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run exact-SHA production LinkedIn repair
        shell: bash
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          EXPECTED_SHA: ${{ inputs.expected_hunter_sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          args="--expected-sha $EXPECTED_SHA"
          if [[ "$MODE" == "apply" ]]; then
            args="$args --apply"
          fi
          ssh \
            -i "$HOME/.ssh/netcup_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$NETCUP_USER@$NETCUP_HOST" \
            "bash /opt/munshi/repo/deploy/netcup/run_linkedin_48h_backfill.sh $args"
