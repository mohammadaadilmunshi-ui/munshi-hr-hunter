name: Linux Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production lock
        run: python -m pip install -r requirements.lock.txt
      - name: Verify installed packages
        run: python -m pip check
      - name: Compile application and scripts
        run: python -m compileall -q app scripts
      - name: Validate n8n portability contract
        run: python scripts/validate_n8n_portability.py
      - name: Audit Linux compatibility
        run: python scripts/audit_linux_compatibility.py
      - name: Run focused portability tests
        run: python -m pytest tests/test_platform_config.py tests/test_linux_compatibility.py
      - name: Import direct third-party dependencies
        run: python -c "import bs4, dotenv, fastapi, httpx, jobspy, pandas, playwright, pycountry, pydantic, requests, streamlit, telegram, uvicorn"
