name: Netcup Staging Last-Known-Good Recovery

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-staging-last-known-good-recovery.yml'

permissions:
  contents: read

concurrency:
  group: munshi-netcup-staging-last-known-good-recovery
  cancel-in-progress: false

jobs:
  probe-installed-staging-recovery:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Configure approved restricted SSH
        shell: bash
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_KNOWN_HOSTS"
          test -n "$NETCUP_HOST"
          test -n "$NETCUP_USER"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/netcup_deploy"
          chmod 600 "$HOME/.ssh/netcup_deploy"
          printf '%s\n' "$NETCUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "NETCUP_HOST=$NETCUP_HOST" >> "$GITHUB_ENV"
          echo "NETCUP_USER=$NETCUP_USER" >> "$GITHUB_ENV"

      - name: Probe exact installed staging-recovery gateway
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/staging-recovery-gateway-probe.log"
          set +e
          ssh -i "$HOME/.ssh/netcup_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$NETCUP_USER@$NETCUP_HOST" \
            "/opt/munshi/bin/recover-staging-auth-bootstrap --from-sha 2fd6814c6685bb21adb1d0d7fd60249680da1c1c --to-sha 1785c022a6a9d3205fcfc36b2aed120494044158 --to-branch fix/dashboard-device-auth-staging-v1" \
            2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "RECOVERY_GATEWAY_RC=$rc"
          if grep -Fq 'request rejected by MUNSHI GitHub deployment gateway' "$LOG"; then
            echo 'RECOVERY_GATEWAY_ACCEPTED=NO'
            exit 41
          fi
          echo 'RECOVERY_GATEWAY_ACCEPTED=YES'
          if grep -Fq 'RESULT=STAGING_AUTH_BOOTSTRAP_RECOVERY_PASS' "$LOG"; then
            echo 'STAGING_RECOVERY_COMPLETED=YES'
          else
            echo 'STAGING_RECOVERY_COMPLETED=NO'
          fi
          # The helper verifies production before any staging mutation. A non-zero
          # return after gateway acceptance is therefore safe incident evidence.
          exit 0
