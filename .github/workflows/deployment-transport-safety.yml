name: Deployment Transport Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-transport-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub to Netcup transport contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          production_workflow = Path(".github/workflows/netcup-production-deploy.yml").read_text(encoding="utf-8")
          staging_workflow = Path(".github/workflows/netcup-staging-deploy.yml").read_text(encoding="utf-8")
          production_deploy = Path("deploy/netcup/deploy_production_release.sh").read_text(encoding="utf-8")
          staging_deploy = Path("deploy/netcup/deploy_staging_release.sh").read_text(encoding="utf-8")
          staging_verify = Path("deploy/netcup/verify_staging_runtime_contract.sh").read_text(encoding="utf-8")
          gateway = Path("deploy/netcup/github_deploy_gateway.sh").read_text(encoding="utf-8")
          production_installer = Path("deploy/netcup/install_github_deploy_key.sh").read_text(encoding="utf-8")
          staging_installer = Path("deploy/netcup/install_staging_deploy_gateway_extension.sh").read_text(encoding="utf-8")

          production_workflow_required = (
              'git fetch --no-tags origin "$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"',
              'git merge-base --is-ancestor "$DEPLOY_SHA" "refs/remotes/origin/$DEPLOY_BRANCH"',
              'git bundle create',
              'git bundle verify "$RUNNER_TEMP/munshi-deploy.bundle"',
              'DEPLOY_COMMAND="/opt/munshi/bin/deploy-production-release --commit $DEPLOY_SHA --branch $DEPLOY_BRANCH"',
              'cat "$RUNNER_TEMP/munshi-deploy.bundle" |',
              'environment: production',
              'group: munshi-netcup-production',
          )
          for token in production_workflow_required:
              assert token in production_workflow, f"production workflow transport token missing: {token}"

          staging_workflow_required = (
              'git fetch --no-tags origin "$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"',
              'git merge-base --is-ancestor "$DEPLOY_SHA" "refs/remotes/origin/$DEPLOY_BRANCH"',
              'git bundle create',
              'git bundle verify "$RUNNER_TEMP/munshi-staging-deploy.bundle"',
              'DEPLOY_COMMAND="/opt/munshi/bin/deploy-staging-release --commit $DEPLOY_SHA --branch $DEPLOY_BRANCH"',
              'cat "$RUNNER_TEMP/munshi-staging-deploy.bundle" |',
              'environment: staging',
              'group: munshi-netcup-staging',
          )
          for token in staging_workflow_required:
              assert token in staging_workflow, f"staging workflow transport token missing: {token}"

          for workflow_name, workflow in (("production", production_workflow), ("staging", staging_workflow)):
              assert "--commit '$DEPLOY_SHA'" not in workflow, f"literal SHA quotes would break {workflow_name} forced-command gateway"
              assert "--branch '$DEPLOY_BRANCH'" not in workflow, f"literal branch quotes would break {workflow_name} forced-command gateway"

          production_deploy_required = (
              'timeout 120s cat > "$bundle_file"',
              'git bundle verify "$bundle_file"',
              'git fetch --no-tags "$bundle_file" "+$bundle_ref:$deploy_ref"',
              'git merge-base --is-ancestor "$commit" "$deploy_ref"',
              'git checkout -q -B "$branch" "$commit"',
              '[[ "$(git branch --show-current)" == "$branch" ]]',
              'docker tag "$old_hunter_image_id" "$hunter_image_name" || true',
              'ROLLBACK_IMAGE_TAG_RESTORED=YES',
              'GITHUB_BUNDLE_IMPORT=PASS',
              'N8N_RECREATED=NO',
              'OLLAMA_RECREATED=NO',
              'RESULT=PRODUCTION_DEPLOYMENT_PASS',
          )
          for token in production_deploy_required:
              assert token in production_deploy, f"production server deployment token missing: {token}"

          staging_deploy_required = (
              'timeout 120s cat > "$bundle_file"',
              'git bundle verify "$bundle_file"',
              'git fetch --no-tags "$bundle_file" "+$bundle_ref:$deploy_ref"',
              'git merge-base --is-ancestor "$commit" "$deploy_ref"',
              'git checkout -q -B "$branch" "$commit"',
              '[[ "$(git branch --show-current)" == "$branch" ]]',
              'docker tag "$old_hunter_image_id" "$hunter_image_name" || true',
              'ROLLBACK_IMAGE_TAG_RESTORED=YES',
              'from app.database import DB_PATH',
              'src = Path(DB_PATH)',
              'dst = Path("/tmp") / f"hunter-predeploy-{stamp}.db"',
              'sqlite3.connect(f"file:{src}?mode=ro", uri=True)',
              'docker cp "$H:/tmp/hunter-predeploy-$stamp.db" "$db_backup"',
              'GITHUB_STAGING_BUNDLE_IMPORT=PASS',
              'STAGING_N8N_RECREATED=NO',
              'STAGING_OLLAMA_RECREATED=NO',
              'STAGING_EDGE_RECREATED=NO',
              'PRODUCTION_CONTAINERS_UNCHANGED=PASS',
              'PRODUCTION_DEPLOYMENT_PERFORMED=NO',
              'RESULT=STAGING_DEPLOYMENT_PASS',
          )
          for token in staging_deploy_required:
              assert token in staging_deploy, f"staging server deployment token missing: {token}"

          assert '/app/hunter/runtime/hunter-predeploy-' not in staging_deploy, "staging DB backup must not depend on unwritable /app/hunter/runtime"

          forbidden_server_fetches = (
              "git fetch --prune origin",
              'git fetch origin "$branch"',
          )
          for token in forbidden_server_fetches:
              assert token not in production_deploy, f"production Netcup deploy must not depend on outbound GitHub fetch: {token}"
              assert token not in staging_deploy, f"staging Netcup deploy must not depend on outbound GitHub fetch: {token}"

          gateway_required = (
              "SSH_ORIGINAL_COMMAND",
              "([0-9a-f]{40})",
              'PRODUCTION_DEPLOY="/opt/munshi/bin/deploy-production-release"',
              'STAGING_DEPLOY="/opt/munshi/bin/deploy-staging-release"',
              'exec "$PRODUCTION_DEPLOY" --commit "$commit" --branch "$branch"',
              'exec "$STAGING_DEPLOY" --commit "$commit" --branch "$branch"',
              'request rejected by MUNSHI GitHub deployment gateway',
          )
          for token in gateway_required:
              assert token in gateway, f"gateway token missing: {token}"

          production_installer_required = (
              '--source-root',
              '--source-sha',
              'git -C "$SOURCE_ROOT" rev-parse HEAD',
              'git -C "$REPO" status --porcelain',
              'APPROVED_SOURCE_SHA=',
              'ROLLBACK GITHUB DEPLOY KEY INSTALL',
              'RESULT=GITHUB_DEPLOY_KEY_INSTALL_ROLLED_BACK',
              'INSTALL_TRANSACTION=PASS',
              'PRIVATE_KEY_INSTALLED_ON_SERVER=NO',
          )
          for token in production_installer_required:
              assert token in production_installer, f"deploy-key bootstrap token missing: {token}"

          staging_installer_required = (
              '--source-root',
              '--source-sha',
              'Stage 13 is not PASS',
              'ROLLBACK STAGING GATEWAY EXTENSION',
              'verify-staging-runtime-contract',
              'deploy-staging-release',
              'AUTHORIZED_KEYS_CHANGED=NO',
              'PRODUCTION_DEPLOYMENT_PERFORMED=NO',
              'STAGING_DEPLOYMENT_PERFORMED=NO',
              'RESULT=STAGING_GATEWAY_EXTENSION_INSTALLED',
          )
          for token in staging_installer_required:
              assert token in staging_installer, f"staging gateway installer token missing: {token}"

          staging_verify_required = (
              'STAGING_SIDE_EFFECT_FLAGS=PASS',
              'STAGING_SIDE_EFFECT_PROCESSES=NONE',
              'STAGING_VOLUME_ISOLATION=PASS',
              'STAGING_RAW_PORTS_LOOPBACK_ONLY=PASS',
              'STAGING_HTTP_HEALTH=PASS',
              'STAGING_DASHBOARD_CONFIG=PASS',
              'STAGING_HTTPS_UNAUTHENTICATED=401',
              'RESULT=STAGING_RUNTIME_CONTRACT_PASS',
          )
          for token in staging_verify_required:
              assert token in staging_verify, f"staging verifier token missing: {token}"

          print("DEPLOYMENT_TRANSPORT_STATIC_GUARD=PASS")
          PY

      - name: Validate deployment shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/netcup/*.sh; do
            bash -n "$script"
          done
          echo "DEPLOYMENT_SHELL_SYNTAX=PASS"

      - name: Exercise Git bundle ancestry transport
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/bundle-transport-test"
          src="$root/source"
          dst="$root/destination"
          bundle="$root/deploy.bundle"
          branch="feat/test-transport"

          mkdir -p "$src" "$dst"

          git -C "$src" init -q
          git -C "$src" config user.name "MUNSHI CI"
          git -C "$src" config user.email "ci@example.invalid"
          printf 'one\n' > "$src/file.txt"
          git -C "$src" add file.txt
          git -C "$src" commit -qm first
          first="$(git -C "$src" rev-parse HEAD)"
          printf 'two\n' >> "$src/file.txt"
          git -C "$src" commit -qam second
          tip="$(git -C "$src" rev-parse HEAD)"
          git -C "$src" update-ref "refs/remotes/origin/$branch" "$tip"

          git -C "$src" merge-base --is-ancestor "$first" "refs/remotes/origin/$branch"
          git -C "$src" bundle create "$bundle" "refs/remotes/origin/$branch"
          git -C "$src" bundle verify "$bundle"

          git -C "$dst" init -q
          production_ref="refs/remotes/github-deploy/$branch"
          staging_ref="refs/remotes/github-staging-deploy/$branch"
          git -C "$dst" fetch --no-tags "$bundle" "+refs/remotes/origin/$branch:$production_ref"
          git -C "$dst" fetch --no-tags "$bundle" "+refs/remotes/origin/$branch:$staging_ref"
          git -C "$dst" cat-file -e "$first^{commit}"
          git -C "$dst" merge-base --is-ancestor "$first" "$production_ref"
          git -C "$dst" merge-base --is-ancestor "$first" "$staging_ref"

          echo "DEPLOYMENT_BUNDLE_TRANSPORT=PASS"
