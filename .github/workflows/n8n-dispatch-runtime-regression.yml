name: n8n Dispatch Runtime Regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n-dispatch-runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile dispatch boundary
        run: python -m compileall -q app/n8n_dispatch.py app/stored_job_n8n_worker.py tests/test_n8n_dispatch_transaction_regression.py

      - name: Run dispatch transaction regressions
        run: python -m pytest -q tests/test_n8n_dispatch_transaction_regression.py

      - name: Guard against tracked runtime state
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3|wal|shm))$'
