name: Netcup Runtime Readonly Incident Probe

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-runtime-readonly-incident-probe.yml'

permissions:
  contents: read

concurrency:
  group: munshi-netcup-runtime-readonly-incident-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Configure restricted SSH
        shell: bash
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_KNOWN_HOSTS"
          test -n "$NETCUP_HOST"
          test -n "$NETCUP_USER"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/netcup_probe"
          chmod 600 "$HOME/.ssh/netcup_probe"
          printf '%s\n' "$NETCUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "NETCUP_HOST=$NETCUP_HOST" >> "$GITHUB_ENV"
          echo "NETCUP_USER=$NETCUP_USER" >> "$GITHUB_ENV"

      - name: Inspect Netcup runtime without mutation
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/netcup_probe" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          "${SSH[@]}" "$NETCUP_USER@$NETCUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "REMOTE_UID=$(id -u)"
          echo "REMOTE_GROUPS=$(id -Gn | tr ' ' ',')"
          if id -Gn | tr ' ' '\n' | grep -Fx docker >/dev/null; then
            echo 'REMOTE_DOCKER_GROUP=YES'
          else
            echo 'REMOTE_DOCKER_GROUP=NO'
          fi

          if ! docker ps >/dev/null 2>&1; then
            echo 'DOCKER_ACCESS=UNAVAILABLE'
            echo 'PROBE_MUTATION=NONE'
            exit 42
          fi
          echo 'DOCKER_ACCESS=AVAILABLE'

          echo 'RUNTIME_CONTAINERS_BEGIN'
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' | grep -E '(hunter|n8n|ollama|caddy)' || true
          echo 'RUNTIME_CONTAINERS_END'

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            echo "CONTAINER_BEGIN=$name"
            docker inspect --format 'COMPOSE_PROJECT={{ index .Config.Labels "com.docker.compose.project" }}' "$name" 2>/dev/null || true
            docker inspect --format 'COMPOSE_SERVICE={{ index .Config.Labels "com.docker.compose.service" }}' "$name" 2>/dev/null || true
            docker inspect --format 'STATE=status={{.State.Status}};exit_code={{.State.ExitCode}};started_at={{.State.StartedAt}};finished_at={{.State.FinishedAt}};restart_count={{.RestartCount}};oom_killed={{.State.OOMKilled}}' "$name" 2>/dev/null || true
            docker inspect --format '{{if .State.Health}}HEALTH={{.State.Health.Status}}{{else}}HEALTH=NONE{{end}}' "$name" 2>/dev/null || true
            echo 'PORTS_BEGIN'
            docker port "$name" 2>/dev/null || true
            echo 'PORTS_END'
            echo "CONTAINER_END=$name"
          done < <(docker ps -a --format '{{.Names}}' | grep -E '(hunter|n8n|ollama|caddy)' || true)

          echo 'PROBE_MUTATION=NONE'
          REMOTE
