services:
  hunter:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FASTAPI_HOST: 0.0.0.0
      STREAMLIT_HOST: 0.0.0.0
      FASTAPI_BASE_URL: http://hunter:8000
      N8N_BASE_URL: http://n8n:5678
      OLLAMA_BASE_URL: http://ollama:11434
      HR_AGENT_OLLAMA_MODEL: ${HR_AGENT_OLLAMA_MODEL:-gemma3:4b}
      HR_AGENT_OLLAMA_TIMEOUT_SECONDS: ${HR_AGENT_OLLAMA_TIMEOUT_SECONDS:-600}
      HR_AGENT_PROCESS_TIMEOUT_SECONDS: ${HR_AGENT_PROCESS_TIMEOUT_SECONDS:-240}
      DICE_BROWSER_EXECUTABLE: /usr/bin/chromium
      HUNTER_API_SECRET: ${HUNTER_API_SECRET:?Set HUNTER_API_SECRET at runtime}
      MUNSHI_VAULT_KEY: ${MUNSHI_VAULT_KEY:-}
      MUNSHI_VAULT_KEY_FILE: ${MUNSHI_VAULT_KEY_FILE:-}
      MUNSHI_VAULT_REQUIRE_KEY_FILE: ${MUNSHI_VAULT_REQUIRE_KEY_FILE:-false}
      MUNSHI_ENVIRONMENT: ${MUNSHI_ENVIRONMENT:-development}
      MUNSHI_AUTOAPPLY_ACCEPTANCE_PASSED: ${MUNSHI_AUTOAPPLY_ACCEPTANCE_PASSED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MUNSHI_RESUME_MODEL: ${MUNSHI_RESUME_MODEL:-gpt-5.6-terra}
      MUNSHI_TENANT_FOUNDATION_ENABLED: ${MUNSHI_TENANT_FOUNDATION_ENABLED:-false}
      MUNSHI_PROFILE_TRUTH_EDITOR_ENABLED: ${MUNSHI_PROFILE_TRUTH_EDITOR_ENABLED:-false}
      MUNSHI_APPLICATION_ANSWER_BRAIN_ENABLED: ${MUNSHI_APPLICATION_ANSWER_BRAIN_ENABLED:-false}
      MUNSHI_APPLICATION_PLAN_V2_ENABLED: ${MUNSHI_APPLICATION_PLAN_V2_ENABLED:-false}
      MUNSHI_APPLY_LIVE_HANDOFF_ENABLED: ${MUNSHI_APPLY_LIVE_HANDOFF_ENABLED:-false}
      MUNSHI_APPLY_HANDOFF_HMAC_SECRET: ${MUNSHI_APPLY_HANDOFF_HMAC_SECRET:-}
      MUNSHI_APPLY_BASE_URL: ${MUNSHI_APPLY_BASE_URL:-}
      MUNSHI_APPLY_INTERNAL_HTTP_ENABLED: ${MUNSHI_APPLY_INTERNAL_HTTP_ENABLED:-false}
      MUNSHI_APPLY_INTERNAL_HTTP_BASE_URL: ${MUNSHI_APPLY_INTERNAL_HTTP_BASE_URL:-}
      MUNSHI_APPLY_COMMAND_SECRET: ${MUNSHI_APPLY_COMMAND_SECRET:-}
      MUNSHI_PRODUCTION_SUBMIT_AUTH_HMAC_SECRET: ${MUNSHI_PRODUCTION_SUBMIT_AUTH_HMAC_SECRET:-}
      MUNSHI_PRODUCTION_RECEIPT_HMAC_SECRET: ${MUNSHI_PRODUCTION_RECEIPT_HMAC_SECRET:-}
      MUNSHI_APPLY_SUBMIT_AUTHORITY_DELIVERY_ENABLED: ${MUNSHI_APPLY_SUBMIT_AUTHORITY_DELIVERY_ENABLED:-false}
      MUNSHI_PREPARE_WORKER_ADAPTERS_V1A_ENABLED: ${MUNSHI_PREPARE_WORKER_ADAPTERS_V1A_ENABLED:-false}
      MUNSHI_PREPARE_WORKER_ADAPTERS_V1B_ENABLED: ${MUNSHI_PREPARE_WORKER_ADAPTERS_V1B_ENABLED:-false}
      MUNSHI_PREPARE_WORKER_ADAPTERS_V1C_ENABLED: ${MUNSHI_PREPARE_WORKER_ADAPTERS_V1C_ENABLED:-false}
      MUNSHI_PREPARE_RUNTIME_WORKER_ENABLED: ${MUNSHI_PREPARE_RUNTIME_WORKER_ENABLED:-false}
      MUNSHI_PREPARE_RUNTIME_WORKER_INTERVAL_SECONDS: ${MUNSHI_PREPARE_RUNTIME_WORKER_INTERVAL_SECONDS:-10}
      MUNSHI_PREPARE_ATS_RUNTIME_START_ENABLED: ${MUNSHI_PREPARE_ATS_RUNTIME_START_ENABLED:-false}
      MUNSHI_APPLY_BACKGROUND_PREPARE_ENABLED: ${MUNSHI_APPLY_BACKGROUND_PREPARE_ENABLED:-false}
      MUNSHI_APPLICATION_PLAN_RUNTIME_RESOLUTION_ENABLED: ${MUNSHI_APPLICATION_PLAN_RUNTIME_RESOLUTION_ENABLED:-false}
      MUNSHI_NATIVE_RESUME_V5_ENABLED: ${MUNSHI_NATIVE_RESUME_V5_ENABLED:-false}
      MUNSHI_FINAL_REVIEW_ENABLED: ${MUNSHI_FINAL_REVIEW_ENABLED:-false}
      MUNSHI_FINAL_SUBMIT_ENABLED: ${MUNSHI_FINAL_SUBMIT_ENABLED:-false}
      MUNSHI_APPLICATION_REVIEW_V2_ENABLED: ${MUNSHI_APPLICATION_REVIEW_V2_ENABLED:-false}
      MUNSHI_APPLICATION_MAIL_RELAY_ENABLED: ${MUNSHI_APPLICATION_MAIL_RELAY_ENABLED:-false}
      MUNSHI_MAIL_SIGNING_SECRET: ${MUNSHI_MAIL_SIGNING_SECRET:-}
      MUNSHI_MAIL_ARTIFACT_HMAC_SECRET: ${MUNSHI_MAIL_ARTIFACT_HMAC_SECRET:-}
      MUNSHI_APPLICATION_EMAIL_NOTIFICATIONS_ENABLED: ${MUNSHI_APPLICATION_EMAIL_NOTIFICATIONS_ENABLED:-false}
      MUNSHI_APPLICATION_NOTIFICATION_WORKER_ENABLED: ${MUNSHI_APPLICATION_NOTIFICATION_WORKER_ENABLED:-false}
      MUNSHI_SMTP2GO_API_KEY: ${MUNSHI_SMTP2GO_API_KEY:-}
      MUNSHI_SMTP2GO_SENDER: ${MUNSHI_SMTP2GO_SENDER:-}
      MUNSHI_CAREER_POLICY_ENABLED: ${MUNSHI_CAREER_POLICY_ENABLED:-false}
      MUNSHI_RELATIONSHIP_INTELLIGENCE_ENABLED: ${MUNSHI_RELATIONSHIP_INTELLIGENCE_ENABLED:-false}
      HUNTER_ENABLE_TELEGRAM: ${HUNTER_ENABLE_TELEGRAM:-false}
      HUNTER_ENABLE_DISCOVERY_SCHEDULER: ${HUNTER_ENABLE_DISCOVERY_SCHEDULER:-false}
      HUNTER_ENABLE_COORDINATOR: ${HUNTER_ENABLE_COORDINATOR:-false}
      HUNTER_COORDINATOR_SKIP_WORKERS: ${HUNTER_COORDINATOR_SKIP_WORKERS:-false}
      HUNTER_COORDINATOR_MODE: ${HUNTER_COORDINATOR_MODE:-production}
      HUNTER_COORDINATOR_WORKER_TIMEOUT: ${HUNTER_COORDINATOR_WORKER_TIMEOUT:-420}
      HUNTER_COORDINATOR_INTERVAL_SECONDS: ${HUNTER_COORDINATOR_INTERVAL_SECONDS:-3600}
      AADIL_HR_HUNTER_PROJECT: /app/hunter
      AADIL_HR_HUNTER_RUNTIME: /app/hunter/.runtime
      AADIL_HR_HUNTER_LOGS: /app/hunter/logs
    volumes:
      - hunter_data:/app/hunter/data
      - hunter_runtime:/app/hunter/.runtime
      - hunter_logs:/app/hunter/logs
      - hunter_secrets:/run/munshi-secrets:ro
    ports:
      - "${HUNTER_FASTAPI_PORT_MAPPING:-127.0.0.1:8000:8000}"
      - "${HUNTER_STREAMLIT_PORT_MAPPING:-127.0.0.1:8501:8501}"
    networks: [application]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  n8n:
    image: n8nio/n8n:2.22.5
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_USER_FOLDER: /home/node
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "${N8N_PORT_MAPPING:-127.0.0.1:5678:5678}"
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks: [application]
    # Model provisioning is an explicit later parity step; no pull command is run here.

networks:
  application:
    driver: bridge

volumes:
  hunter_data:
  hunter_runtime:
  hunter_logs:
  hunter_secrets:
  n8n_data:
  ollama_models: