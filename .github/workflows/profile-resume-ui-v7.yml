name: Profile and Resume UI V7

on:
  pull_request:
    paths:
      - "app/profile_workspace_v4.py"
      - "app/master_resume_file_ui_v1.py"
      - "app/profile_answer_center_ui_v3.py"
      - "app/resume_visual_studio_v7.py"
      - "app/resume_studio_page.py"
      - "tests/test_profile_resume_ui_v7.py"
      - ".github/workflows/profile-resume-ui-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-resume-ui-v7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile UI tranche
        run: |
          python -m py_compile \
            app/profile_workspace_v4.py \
            app/master_resume_file_ui_v1.py \
            app/profile_answer_center_ui_v3.py \
            app/resume_visual_studio_v6.py \
            app/resume_visual_studio_v7.py \
            app/resume_studio_page.py \
            tests/test_profile_resume_ui_v7.py

      - name: Run focused UI and semantic regression tests
        run: |
          python -m pytest -q \
            tests/test_profile_resume_ui_v7.py \
            tests/test_application_question_catalog_gap_progression.py

      - name: Guard repository state
        run: |
          set -euo pipefail
          git diff --check
