name: Netcup Provider Secret Probe

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-provider-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Report provider secret availability only
        shell: bash
        env:
          CUSTOMER: ${{ secrets.NETCUP_CUSTOMER_NUMBER }}
          API_KEY: ${{ secrets.NETCUP_API_KEY }}
          API_PASSWORD: ${{ secrets.NETCUP_API_PASSWORD }}
          SERVER_ID: ${{ secrets.NETCUP_SERVER_ID }}
          SERVER_NAME: ${{ secrets.NETCUP_SERVER_NAME }}
          SCP_USER: ${{ secrets.NETCUP_SCP_USER }}
          SCP_PASSWORD: ${{ secrets.NETCUP_SCP_PASSWORD }}
          SCP_API_KEY: ${{ secrets.NETCUP_SCP_API_KEY }}
        run: |
          set -euo pipefail
          for name in CUSTOMER API_KEY API_PASSWORD SERVER_ID SERVER_NAME SCP_USER SCP_PASSWORD SCP_API_KEY; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=AVAILABLE"
            else
              echo "$name=UNAVAILABLE"
            fi
          done
