name: Netcup Admin Secret Probe

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-admin-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Report admin-key secret availability only
        shell: bash
        env:
          A: ${{ secrets.NETCUP_ADMIN_SSH_PRIVATE_KEY }}
          B: ${{ secrets.NETCUP_ROOT_SSH_PRIVATE_KEY }}
          C: ${{ secrets.NETCUP_SSH_PRIVATE_KEY_ADMIN }}
          D: ${{ secrets.NETCUP_ADMIN_KEY }}
          E: ${{ secrets.NETCUP_ROOT_KEY }}
          F: ${{ secrets.NETCUP_RECOVERY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in A B C D E F; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=AVAILABLE"
            else
              echo "$name=UNAVAILABLE"
            fi
          done
