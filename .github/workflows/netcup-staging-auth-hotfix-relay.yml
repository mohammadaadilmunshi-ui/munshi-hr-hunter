name: Netcup Staging Auth Hotfix Relay

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - "config/staging-auth-hotfix-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: munshi-netcup-staging
  cancel-in-progress: false

env:
  STAGING_BASE_SHA: e720251aa89edb24e9645b60e321d557f8b72a5f
  AUTH_HOTFIX_BRANCH: fix/dashboard-device-auth-staging-v1

jobs:
  resolve-request:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
    steps:
      - name: Checkout trusted staging-control branch
        uses: actions/checkout@v4
        with:
          ref: feat/autonomous-career-os-foundation
          fetch-depth: 0

      - name: Resolve and strictly scope staging auth request
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="config/staging-auth-hotfix-request.json"
          test -f "$REQUEST_FILE"
          SHA="$(python -c 'import json; print(json.load(open("config/staging-auth-hotfix-request.json"))["commit_sha"])')"
          BRANCH="$(python -c 'import json; print(json.load(open("config/staging-auth-hotfix-request.json"))["source_branch"])')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$BRANCH" = "$AUTH_HOTFIX_BRANCH" || {
            echo "staging auth relay accepts only $AUTH_HOTFIX_BRANCH" >&2
            exit 3
          }
          git fetch --no-tags origin "$BRANCH:refs/remotes/origin/$BRANCH"
          git merge-base --is-ancestor "$STAGING_BASE_SHA" "$SHA" || {
            echo "candidate is not descended from exact current staging baseline" >&2
            exit 4
          }
          git merge-base --is-ancestor "$SHA" "refs/remotes/origin/$BRANCH" || exit 5

          mapfile -t changed < <(git diff --name-only "$STAGING_BASE_SHA" "$SHA")
          test "${#changed[@]}" -gt 0
          printf 'Staging auth hotfix changed files:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              app/device_auth.py|app/api_device_auth.py|docker/hunter-supervisor.py|deploy/caddy/Caddyfile.dashboard.template|deploy/caddy/Caddyfile.staging.template|tests/test_device_auth.py) ;;
              *) echo "STAGING_AUTH_SCOPE_VIOLATION=$path" >&2; exit 6 ;;
            esac
          done

          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging auth-only release request"
            echo "- exact staging baseline: \`$STAGING_BASE_SHA\`"
            echo "- exact auth candidate: \`$SHA\`"
            echo "- source branch: \`$BRANCH\`"
            echo "- existing Native Resume Studio/n8n selector baseline preserved"
            echo "- production deployment: not present in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  deployment-ci:
    needs: resolve-request
    uses: ./.github/workflows/deployment-ci-reusable.yml
    with:
      commit_sha: ${{ needs.resolve-request.outputs.commit_sha }}

  auth-and-staging-regression-gate:
    needs: resolve-request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging auth candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-request.outputs.commit_sha }}
          fetch-depth: 0

      - name: Re-prove exact ancestry and auth-only diff
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve-request.outputs.commit_sha }}
          RELEASE_BRANCH: ${{ needs.resolve-request.outputs.source_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin "$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          git merge-base --is-ancestor "$STAGING_BASE_SHA" "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$RELEASE_BRANCH"
          while IFS= read -r path; do
            case "$path" in
              app/device_auth.py|app/api_device_auth.py|docker/hunter-supervisor.py|deploy/caddy/Caddyfile.dashboard.template|deploy/caddy/Caddyfile.staging.template|tests/test_device_auth.py) ;;
              *) echo "STAGING_AUTH_SCOPE_VIOLATION=$path" >&2; exit 20 ;;
            esac
          done < <(git diff --name-only "$STAGING_BASE_SHA" "$RELEASE_SHA")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile auth and preserved resume selector paths
        run: |
          python -m py_compile \
            app/device_auth.py \
            app/api_device_auth.py \
            docker/hunter-supervisor.py \
            app/resume_engine_selector.py \
            app/native_resume_service.py \
            tests/test_device_auth.py

      - name: Run auth plus preserved staging regressions
        run: |
          python -m pytest -q \
            tests/test_device_auth.py \
            tests/test_hunter_supervisor.py \
            tests/test_resume_engine_selector.py \
            tests/test_native_resume_service.py \
            tests/test_product_ui_v22.py

      - name: Verify staging Caddy trusted-device contract statically
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE=deploy/caddy/Caddyfile.staging.template
          test "$(grep -c '^[[:space:]]*basic_auth[[:space:]]*{' "$TEMPLATE")" = "1"
          grep -F '@device_login path /_munshi-auth/login' "$TEMPLATE"
          grep -F 'forward_auth 127.0.0.1:18000' "$TEMPLATE"
          grep -F 'uri /_munshi-auth/verify' "$TEMPLATE"
          grep -F 'reverse_proxy 127.0.0.1:18501' "$TEMPLATE"
          grep -F '__Host-munshi_device_session' app/device_auth.py
          grep -F 'app.api_device_auth:app' docker/hunter-supervisor.py
          git diff --check

  deploy-staging-auth-only:
    needs: [resolve-request, deployment-ci, auth-and-staging-regression-gate]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging auth SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-request.outputs.commit_sha }}
          fetch-depth: 0

      - name: Build authenticated exact-SHA staging bundle
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.resolve-request.outputs.commit_sha }}
          DEPLOY_BRANCH: ${{ needs.resolve-request.outputs.source_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          git merge-base --is-ancestor "$DEPLOY_SHA" "refs/remotes/origin/$DEPLOY_BRANCH"
          git bundle create "$RUNNER_TEMP/munshi-staging-auth.bundle" "refs/remotes/origin/$DEPLOY_BRANCH"
          git bundle verify "$RUNNER_TEMP/munshi-staging-auth.bundle"

      - name: Configure restricted SSH
        shell: bash
        env:
          NETCUP_SSH_PRIVATE_KEY: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          NETCUP_KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_SSH_PRIVATE_KEY"
          test -n "$NETCUP_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NETCUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/netcup_deploy"
          chmod 600 "$HOME/.ssh/netcup_deploy"
          printf '%s\n' "$NETCUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy auth backend through hardened staging wrapper
        shell: bash
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
          DEPLOY_SHA: ${{ needs.resolve-request.outputs.commit_sha }}
          DEPLOY_BRANCH: ${{ needs.resolve-request.outputs.source_branch }}
        run: |
          set -euo pipefail
          DEPLOY_COMMAND="/opt/munshi/bin/deploy-staging-release --commit $DEPLOY_SHA --branch $DEPLOY_BRANCH"
          LOG="$RUNNER_TEMP/staging-auth-deploy.log"
          cat "$RUNNER_TEMP/munshi-staging-auth.bundle" | \
            ssh \
              -i "$HOME/.ssh/netcup_deploy" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$NETCUP_USER@$NETCUP_HOST" \
              "$DEPLOY_COMMAND" | tee "$LOG"
          grep -F "DEPLOYED_SHA=$DEPLOY_SHA" "$LOG"
          grep -F "DEPLOYED_BRANCH=$DEPLOY_BRANCH" "$LOG"
          grep -F "STAGING_N8N_RECREATED=NO" "$LOG"
          grep -F "STAGING_OLLAMA_RECREATED=NO" "$LOG"
          grep -F "STAGING_EDGE_RECREATED=NO" "$LOG"
          grep -F "PRODUCTION_CONTAINERS_CHANGED=NO" "$LOG"
          grep -F "PRODUCTION_DEPLOYMENT_PERFORMED=NO" "$LOG"
          grep -F "RESULT=STAGING_DEPLOYMENT_PASS" "$LOG"

      - name: Verify existing HTTPS edge remains protected before cutover
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' https://staging-dashboard.munshi.systems/)"
          test "$CODE" = "401"
          echo "STAGING_PRE_CUTOVER_UNAUTHENTICATED_HTTP=$CODE"

      - name: Record backend receipt and explicit edge boundary
        shell: bash
        env:
          DEPLOY_SHA: ${{ needs.resolve-request.outputs.commit_sha }}
        run: |
          {
            echo "### Staging dashboard-auth backend deployed"
            echo "- exact SHA: \`$DEPLOY_SHA\`"
            echo "- WAL-safe DB backup + rollback image: enforced by staging wrapper"
            echo "- staging n8n/Ollama/edge: not recreated"
            echo "- production containers: unchanged"
            echo "- dashboard trusted-device API: deployed with Hunter"
            echo "- edge Caddy cutover: NOT performed by this restricted workflow"
            echo "- status: \`EDGE_CUTOVER_PENDING=YES\` until privileged Caddy reload is separately verified"
          } >> "$GITHUB_STEP_SUMMARY"
