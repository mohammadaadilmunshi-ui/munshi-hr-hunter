name: Release Hotfix PR CI

on:
  pull_request:
    branches:
      - release/universal-brain-production-20260920

permissions:
  contents: read

jobs:
  deployment-ci:
    uses: ./.github/workflows/deployment-ci-reusable.yml
    with:
      commit_sha: ${{ github.event.pull_request.head.sha }}

  prepare-runtime-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hotfix SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production lock
        run: python -m pip install -r requirements.lock.txt

      - name: Compile touched runtime modules
        run: |
          python -m py_compile             app/application_field_intelligence_v1.py             app/answer_brain_v2.py             app/prepare_runtime_worker.py             app/native_resume_service_v5.py

      - name: Run Prepare runtime regression suite
        run: |
          python -m pytest             tests/test_prepare_runtime_worker.py             tests/test_prepare_runtime_resilience_v1_20260921.py
