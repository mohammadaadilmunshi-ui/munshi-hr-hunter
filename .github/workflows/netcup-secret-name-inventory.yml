name: Netcup Secret Name Inventory

on:
  push:
    branches:
      - feat/autonomous-career-os-foundation
    paths:
      - '.github/workflows/netcup-secret-name-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Print secret names only
        shell: bash
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          names = sorted(json.loads(os.environ['SECRETS_JSON']).keys())
          print('SECRET_NAMES_BEGIN')
          for name in names:
              print(name)
          print('SECRET_NAMES_END')
          PY
