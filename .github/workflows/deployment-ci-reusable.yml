name: Deployment CI Reusable

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  MUNSHI_FINAL_SUBMIT_ENABLED: "false"
  MUNSHI_APPLY_SUBMIT_AUTHORITY_DELIVERY_ENABLED: "false"

jobs:
  production-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production lock
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q app scripts integrations

      - name: Run existing portability validation
        run: |
          python scripts/validate_container_environment_contract.py
          python scripts/validate_n8n_portability.py
          python scripts/validate_netcup_shadow.py
          python scripts/audit_linux_compatibility.py

      - name: Run focused production tests
        run: |
          python -m pytest \
            tests/test_platform_config.py \
            tests/test_linux_compatibility.py \
            tests/test_container_environment_contract.py \
            tests/test_hr_agent_portability.py \
            tests/test_n8n_deployment_renderer.py \
            tests/test_netcup_shadow.py \
            tests/test_complete_loop_deployment_migrations.py \
            tests/test_application_plan_v2.py \
            tests/test_application_plan_runtime_revision_v2.py \
            tests/test_application_plan_transport_v2.py \
            tests/test_application_plan_delivery_v2.py \
            tests/test_prepare_worker_adapters_v1c.py \
            tests/test_mailbox_verification_service_v1.py \
            tests/test_inbound_mail_relay_v1.py \
            tests/test_ats_verification_orchestrator.py \
            tests/test_linkedin_link_contract_v2.py \
            tests/test_linkedin_recent_backfill.py \
            tests/test_application_execution_mandate_v1.py \
            tests/test_single_approval_route_retirement_v1.py \
            tests/test_product_application_flow_v2.py \
            tests/test_full_autoapply_production_activation.py \
            tests/test_universal_runtime_integration_v2.py \
            tests/test_initial_dashboard_single_approval_contract_v1.py \
            tests/test_staging_autoapply_canary.py

      - name: Validate deployment shell
        run: |
          set -euo pipefail
          for script in deploy/netcup/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
          grep -Fq 'docker run --rm -i' deploy/netcup/deploy_production_release.sh
          echo "PRODUCTION_BACKUP_CONTAINER_STDIN_CONTRACT=PASS"
          test "$MUNSHI_FINAL_SUBMIT_ENABLED" = "false"
          test "$MUNSHI_APPLY_SUBMIT_AUTHORITY_DELIVERY_ENABLED" = "false"
          grep -Fq 'MUNSHI_FINAL_SUBMIT_ENABLED: "false"' compose.netcup-shadow.yaml
          grep -Fq 'MUNSHI_APPLY_SUBMIT_AUTHORITY_DELIVERY_ENABLED: "false"' compose.netcup-shadow.yaml
          python -m py_compile app/linkedin_recent_backfill.py scripts/linkedin_recent_backfill.py
          grep -Fq 'AUTHORIZED_LINKEDIN_48H_BACKFILL' scripts/linkedin_recent_backfill.py
          echo "STAGING_FINAL_SUBMIT_HARD_OFF=PASS"

      - name: Build production Hunter image
        run: docker build --tag munshi-hunter:deployment-ci .

      - name: Verify JobSpy runtime contract in built image
        run: |
          docker run --rm -i --entrypoint python munshi-hunter:deployment-ci - <<'PY'
          import hashlib, importlib.metadata, pathlib
          runner = pathlib.Path("/app/hunter/tools/runners/jobspy_runner.py")
          assert importlib.metadata.version("python-jobspy") == "1.1.82"
          assert runner.is_file()
          digest = hashlib.sha256(runner.read_bytes()).hexdigest()
          assert digest == "722878a265ebdabb525044e7fe208d03397b35287256f9c073b3779283b120ce", digest
          print("JOBSPY_IMAGE_CONTRACT=PASS")
          print("JOBSPY_RUNNER_SHA256=", digest)
          PY
