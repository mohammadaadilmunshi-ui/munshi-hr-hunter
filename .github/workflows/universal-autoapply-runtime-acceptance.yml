name: Universal AutoApply Runtime Acceptance

on:
  pull_request:
    paths:
      - "app/application_plan_v2.py"
      - "app/prepare_worker_adapters_v1c.py"
      - "app/inbound_mail.py"
      - "app/mailbox_verification_service.py"
      - "app/ats_verification_orchestrator.py"
      - "app/application_workspace_page.py"
      - "app/application_execution_mandate_v1.py"
      - "app/product_application_flow_v2.py"
      - "app/api.py"
      - "tests/test_application_plan_v2.py"
      - "tests/test_prepare_worker_adapters_v1c.py"
      - "tests/test_universal_runtime_integration_v2.py"
      - "tests/test_initial_dashboard_single_approval_contract_v1.py"
      - "scripts/staging_autoapply_canary.py"
      - "deploy/netcup/run_staging_autoapply_canary.sh"
      - "tests/test_staging_autoapply_canary.py"
      - "compose.netcup-shadow.yaml"
      - "deploy/netcup/deploy_staging_release.sh"
      - ".github/workflows/deployment-ci-reusable.yml"
      - ".github/workflows/staging-autoapply-preparation-canary.yml"
      - ".github/workflows/universal-autoapply-runtime-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUNSHI_FINAL_SUBMIT_ENABLED: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify dependency graph
        run: python -m pip check

      - name: Compile runtime integration surfaces
        run: |
          python -m py_compile \
            app/application_plan_v2.py \
            app/prepare_worker_adapters_v1c.py \
            app/inbound_mail.py \
            app/mailbox_verification_service.py \
            app/ats_verification_orchestrator.py \
            app/application_execution_mandate_v1.py \
            app/application_workspace_page.py \
            app/product_application_flow_v2.py \
            app/api.py

      - name: Run full Universal AutoApply Hunter runtime regression
        run: |
          python -m pytest -q \
            tests/test_application_plan_v2.py \
            tests/test_application_plan_runtime_revision_v2.py \
            tests/test_application_plan_transport_v2.py \
            tests/test_application_plan_delivery_v2.py \
            tests/test_prepare_worker_adapters_v1c.py \
            tests/test_mailbox_verification_service_v1.py \
            tests/test_inbound_mail_relay_v1.py \
            tests/test_ats_verification_orchestrator.py \
            tests/test_linkedin_link_contract_v2.py \
            tests/test_application_execution_mandate_v1.py \
            tests/test_application_review_v2.py \
            tests/test_application_submit_authorization_v1.py \
            tests/test_single_approval_route_retirement_v1.py \
            tests/test_product_application_flow_v2.py \
            tests/test_full_autoapply_production_activation.py \
            tests/test_universal_runtime_integration_v2.py \
            tests/test_initial_dashboard_single_approval_contract_v1.py \
            tests/test_staging_autoapply_canary.py

      - name: Prove irreversible authority remains disabled
        shell: bash
        run: |
          set -euo pipefail
          test "${MUNSHI_FINAL_SUBMIT_ENABLED}" = "false"
          ! git diff --check
          ! git ls-files | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3|wal|shm|pem|p12|pfx|key))$'
          grep -F "No second review follows." app/application_workspace_page.py
          grep -F "one and only customer Approve & Submit decision" app/application_execution_mandate_v1.py
          echo "UNIVERSAL_AUTOAPPLY_RUNTIME_ACCEPTANCE=PASS"
