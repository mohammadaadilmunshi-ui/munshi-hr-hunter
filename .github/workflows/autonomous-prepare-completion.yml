name: Autonomous Prepare Completion

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-prepare-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile autonomous preparation boundary
        run: >-
          python -m compileall -q
          app/autonomous_prepare_v1.py
          app/relay_single_prepare_v1.py
          app/autonomous_prepare_admission_v1.py
          app/autonomous_prepare_compat_v1.py
          app/unified_hourly_coordinator.py
          app/product_application_flow_v2.py
          app/native_resume_studio.py
          app/native_resume_service.py
          app/native_resume_service_v5.py
          app/native_resume_artifact_v5.py
          app/answer_brain_v2.py
          app/application_answer_autofill_v1.py
          app/prepare_orchestrator_v1.py
          app/prepare_runtime_worker.py
          app/prepare_worker_adapters_v1a.py
          app/prepare_worker_adapters_v1b.py
          app/prepare_worker_adapters_v1c.py
          tests/test_autonomous_prepare_v1.py
          tests/test_autonomous_prepare_admission_v1.py
          tests/test_autonomous_prepare_compat_v1.py

      - name: Run autonomous preparation contract tests
        run: >-
          python -m pytest -q
          tests/test_autonomous_prepare_v1.py
          tests/test_autonomous_prepare_admission_v1.py
          tests/test_autonomous_prepare_compat_v1.py
          tests/test_relay_single_prepare_v1.py
          tests/test_prepare_runtime_worker.py
          tests/test_product_application_flow_v2.py
          tests/test_prepare_worker_adapters_v1a.py
          tests/test_prepare_worker_adapters_v1b.py
          tests/test_prepare_worker_adapters_v1c.py
          tests/test_application_smart_autofill_v1.py
          tests/test_native_resume_artifact_v5.py
          tests/test_profile_resume_answer_unification_v1.py

      - name: Guard submission authority and tracked runtime state
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings '"final_submit": True' app/autonomous_prepare_v1.py app/autonomous_prepare_admission_v1.py app/autonomous_prepare_compat_v1.py app/unified_hourly_coordinator.py
          ! git ls-files | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3|wal|shm))$'
