name: Product UI Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-ui-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Verify packages
        run: python -m pip check

      - name: Compile Product UI sources and tests
        run: python -m compileall -q app migrations tests

      - name: Guard against runtime state and secrets
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3|wal|shm))$'

      - name: Run Product UI and producer-boundary tests
        run: |
          python -m pytest \
            tests/test_dashboard_smoke.py \
            tests/test_product_state.py \
            tests/test_product_n8n_dispatch.py \
            tests/test_product_manual_input.py \
            tests/test_product_schema.py \
            tests/test_secure_vault.py \
            tests/test_gmail_integration.py
